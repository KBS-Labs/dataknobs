[project]
name = "dataknobs-workspace"
version = "1.0.0"
description = "Dataknobs monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dataknobs-common",
    "dataknobs-config",
    "dataknobs-data",
    "dataknobs-fsm",
    "dataknobs-llm",
    "dataknobs-bots",
    "dataknobs-structures",
    "dataknobs-utils",
    "dataknobs-xization",
    "dataknobs",
]

[dependency-groups]
dev = [
    "hatchling>=1.21.0",
    "editables>=0.3",
    "pytest>=9.0.3",  # GHSA-6w46-j5rx-g56g (CVSS 6.8) fixed in 9.0.3
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.21.0",
    "pylint>=3.3.6",
    "black>=26.3.1",  # PYSEC-2024-48, GHSA-3936-cmfr-pm3m (CVSS 8.7) fixed by 26.3.1
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "types-PyYAML>=6.0.0",
    # botocore arrives transitively via aioboto3 and is imported directly for
    # its config, exceptions and session modules. Stubs rather than an
    # ignore_missing_imports override, which would type all three as Any.
    "botocore-stubs>=1.34.0",
    "numpy>=1.24.0",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.1",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "markdown>=3.8.1",  # GHSA-5wmx-573v-2qwq (XSS, CVSS 7.5) fixed in 3.8.1 — transitive via mkdocs-material; its own constraint `markdown~=3.2` permits the vulnerable version, so explicit floor required
    "pymdown-extensions>=11.0.1",  # GHSA-gm37-52c6-37mw / CVE-2026-67422 (exponential-backtracking ReDoS in the caret/tilde/betterem/magiclink inline processors, CVSS 7.5) fixed in 11.0.1; extends the prior >=11.0.0 floor (GHSA-9xwg-3r6f-jcx2 / CVE-2026-61632, CVSS 5.3) and sweeps GHSA-62q4-447f-wv8h (CVSS 4.3, 10.21.3) and GHSA-r6h4-mm7h-8pmq (CVSS 2.7, 10.16.1) — transitive via mkdocs-material, whose own constraint permits the vulnerable version, so an explicit floor is required
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-monorepo-plugin>=1.0.5",
    "mkdocs-awesome-pages-plugin>=2.9.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",  # randomized test order; prints/replays a seed so order-dependent flakes are reproducible from the log
    # Optional vector backends (faiss-cpu, chromadb, pgvector, asyncpg) must be
    # present in the synced dev/test env so the @requires_faiss / @requires_*
    # behavioral suites RUN rather than silently skip. `vector` stays an
    # optional *consumer* extra; this only activates it for workspace dev.
    # Referenced via the extra (not re-listed) to keep version specifiers
    # single-sourced in packages/data/pyproject.toml.
    "dataknobs-data[vector]",
    # The provider SDKs must be present in the synced dev/test env so each
    # provider's vendor-error-translation behavioral tests RUN against the real
    # SDK exception classes rather than fakes (no fakes for the real
    # dependency's error types): anthropic + openai expose ``APIError``
    # subtrees; ollama/huggingface speak aiohttp; bedrock speaks botocore (via
    # aioboto3). Referenced via the extras to single-source the version
    # specifiers in packages/llm/pyproject.toml.
    "dataknobs-llm[anthropic,openai,ollama,huggingface,bedrock]",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dataknobs-common = { workspace = true }
dataknobs-config = { workspace = true }
dataknobs-data = { workspace = true }
dataknobs-fsm = { workspace = true }
dataknobs-llm = { workspace = true }
dataknobs-bots = { workspace = true }
dataknobs-structures = { workspace = true }
dataknobs-utils = { workspace = true }
dataknobs-xization = { workspace = true }
dataknobs = { workspace = true }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# A bare `# type: ignore` waives every check on its line, including ones written
# years after it. `warn_unused_ignores` cannot reach that: a bare directive that
# still suppresses *something* is used, so it never goes stale, and what it
# suppresses is free to change underneath it. Requiring the code is what makes a
# suppression reviewable -- and what lets a directive stop applying loudly.
#
# Enabled tree-wide, with the four exceptions below. The default direction is
# deliberate: a new package, or a new top-level directory, is covered on the day
# it appears rather than on the day someone remembers to list it.
enable_error_code = ["ignore-without-code"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/common/src:packages/config/src:packages/data/src:packages/llm/src:packages/bots/src:packages/structures/src:packages/utils/src:packages/xization/src:packages/fsm/src:packages/legacy/src"
cache_dir = ".mypy_cache"
incremental = true
# The only mypy configuration. There used to be a second — mypy.ini — which
# disabled twenty error codes and was what bin/validate.sh read by default,
# while the quality contract measured under this one. Two configurations meant
# two answers to "is this clean", and the weaker one was the one a developer
# saw. The ceilings in .dataknobs/quality-contract.json are what makes a single
# strict configuration usable against a tree that is not yet strict-clean.

# Per-module options
#
# A section here that matches no module suppresses nothing. mypy reports that as
# a *note*, so nothing fails on it, and the quality contract's mypy check reads
# the note and does. Three sections were dead when that check was written, and
# two of them had been written to waive findings that were still being reported:
# `dataknobs_legacy.*` (the package's module is `dataknobs`) and `python_nmap.*`
# (the library imported is `nmap3`, from a different distribution entirely).
[[tool.mypy.overrides]]
module = [
    "nltk.*",
    "graphviz.*",
    "pyparsing.*",
    "json_stream.*",
    "more_itertools.*",
    # A hard dependency of dataknobs-utils (distribution `python3-nmap`) that
    # ships neither stubs nor a py.typed marker, and has no stub package.
    # Typeshed's `types-python-nmap` covers the *other* library -- distribution
    # `python-nmap`, module `nmap` -- which is what an override spelled
    # `python_nmap.*` was reaching for here, and why it matched nothing for as
    # long as it existed.
    "nmap3.*",
    "asyncpg.*",
    # Imported inside a try/except ImportError by bin/check-services.py, as the
    # more accurate of its two PostgreSQL liveness probes. Stubs are not carried
    # for a driver nothing in the workspace depends on.
    "psycopg2.*",
    "aioboto3.*",
    "pandas.*",
    "pandas.api.types.*",
    "faiss.*",
    "chromadb.*",
    "chromadb.config.*",
    "chromadb.utils.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

# Relaxed type checking for dataknobs_xization (complex NLP/annotation code)
[[tool.mypy.overrides]]
module = "dataknobs_xization.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false

# `ignore-without-code`, paused where a backlog predates it.
#
# These four packages hold 66 bare directives between them. Their ceilings in
# .dataknobs/quality-contract.json equal their measurements exactly, so turning
# the rule on for them would breach all four at once -- and `update_baseline`
# lowers a ceiling, never raises one. Rather than re-baseline four packages to
# absorb a rule none of them has read, each pays for its own when it is adopted:
# the entry comes out, the directives get their codes, and the ceiling falls.
#
# So this list is expected to shrink to nothing, and an entry that outlives its
# package's adoption is the failure mode -- a package at tier `strict` while the
# rule that makes its suppressions readable is still switched off. That is what
# `test_ignore_without_code_tracks_the_adopted_set` asserts, since mypy cannot:
# a section that matches modules is a *used* section however little it earns.
#
# Counts measured 2026-08-10 on `ce926e32`, whole-tree.
[[tool.mypy.overrides]]
module = [
    "dataknobs_fsm.*",   # 46
    "dataknobs_data.*",  #  9
    "dataknobs_llm.*",   #  8
    "dataknobs_bots.*",  #  3
]
disable_error_code = ["ignore-without-code"]

# Gradual migration for complex vector store implementations
[[tool.mypy.overrides]]
module = [
    "dataknobs_data.vector.stores.faiss",
    "dataknobs_data.vector.stores.chroma",
    "dataknobs_data.validation.constraints",
    "dataknobs_data.validation.factory"
]
# Relax strictness for modules with complex type issues
warn_return_any = false
warn_unused_ignores = false
allow_untyped_defs = true

[tool.ruff]
# Ruff configuration for the entire workspace
target-version = "py312"
line-length = 100

# Include/exclude patterns
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-include = ["*.ipynb"]
# Where a first-party module name resolves from. The package trees answer for
# code under packages/; the last two answer for the code that belongs to no
# package and is now linted alongside it -- `.` so a `tests.` import resolves,
# `src` for the workspace shim. Without them isort classified both as
# third-party, which passes today only because `pytest` happens to sort before
# `tests`: the misgrouping is invisible until an import lands on the other side
# of that accident, and then it is an I001 arguing for the wrong layout.
src = ["packages/*/src", "packages/*/tests", ".", "src"]

[tool.ruff.lint]
# Rule selection
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
    "PTH",  # flake8-use-pathlib
    "ERA",  # flake8-eradicate
    "PL",   # Pylint
    "NPY",  # NumPy-specific rules
    "PD",   # pandas-vet
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "PYI",  # flake8-pyi
    "ASYNC",  # flake8-async - async code must not block the event loop
]

ignore = [
    # -------------------------------------------------------------------------
    # Every entry carries a [category] marker, checked by tests/test_lint_policy.py
    # and readable with `bin/quality-contract.py explain <CODE> [<path>]`.
    #
    #   [presentational]     no finding of this rule can be a behaviour difference
    #   [covered-elsewhere]  another tool enforces the property; the reason names it
    #   [behavioural]        findings can be real; declined with an argument, which
    #                        is the continuation line(s) under the entry
    #   [provisional]        findings can be real and the decline is NOT yet argued;
    #                        the reason carries the measured count, and the target
    #                        for the total of those counts is zero
    #
    # The category is a property of what a *fix* would do, not of what the rule is
    # named. W291 reads as whitespace hygiene and is not; SIM113 reads as a loop
    # idiom and its advice is invalid at one of its two sites. Read the findings
    # before assigning a category to a rule.
    # -------------------------------------------------------------------------

    # Documentation — a docstring's presence, mood or blank-line placement is not
    # a runtime property.
    "D100", # [presentational] Missing docstring in public module
    "D101", # [presentational] Missing docstring in public class
    "D102", # [presentational] Missing docstring in public method
    "D103", # [presentational] Missing docstring in public function
    "D105", # [presentational] Missing docstring in magic method
    "D107", # [presentational] Missing docstring in __init__
    "D203", # [covered-elsewhere] 1 blank line before class docstring -- D211 enforces
            # the opposite and is enabled, so the property is decided, not unmeasured.
            # Filed presentational until it was read: that category claims a finding
            # could never matter, where the truth is that it always would -- this pair
            # is mutually exclusive by construction and 3,883 findings is simply the
            # count of classes D211 already governs.
    "D205", # [presentational] 1 blank line between summary line and description
    "D210", # [presentational] No whitespace allowed surrounding docstring text
    "D213", # [covered-elsewhere] Multi-line summary starts on second line -- D212
            # enforces the opposite and is enabled. D203's case exactly, and the
            # larger of the two at 9,625 findings, which is the single biggest number
            # behind any entry in this list and was standing under the category that
            # requires nothing be said about it.
    "D401", # [presentational] First line should be in imperative mood
    "D415", # [presentational] First line should end with period
            # The fix appends one character to a docstring's first line, and 101 of
            # the 105 findings carry it as unsafe. Where that reaches rendered
            # output it is named rather than waved past: 18 sit on click commands
            # in the fsm CLI, whose docstrings click renders as `--help` text, so a
            # fix moves a period in help output. That is a change to presentation,
            # which is what this category is for -- the test is whether program
            # behaviour can differ, and a period in help text is not that. None are
            # in bin/, so the argparse __doc__ readers noted under D200 are untouched.
    "D417", # [presentational] Missing argument description in docstring

    # flake8-bugbear
    "B905", # [provisional] zip() without an explicit strict parameter — 36 findings,
            # 17 of them in src/, and not one has been read. Silent truncation to the
            # shorter iterable is a real defect shape, so this decline is unargued
            # rather than argued, and naming that is what this category is for.

    # flake8-eradicate - allow commented code with TODOs
    "ERA001", # [presentational] Found commented-out code — a comment does not run

    # Physical-line rules — these measure a line of the file, so a finding inside a
    # triple-quoted string is a statement about that string's *content*, not about
    # layout. `ruff format` is enforced at 0 across all nine cells and has never
    # touched any of them, which is the same fact from the other side: the formatter
    # does not reach inside string tokens either.
    #
    # W291 and W293 used to be declined here on that argument. It was the right
    # reading of the mechanism and the wrong conclusion: W291's three findings were
    # all trailing spaces in f-string SQL, where whitespace is insignificant, and
    # W293 had none at all. Two rules were off across the tree to hold three
    # harmless spaces. They are enforced now, the three are fixed, and a future
    # finding inside a literal where the whitespace *is* significant takes a
    # per-line `# noqa` naming that literal -- which is a claim about one string,
    # where a decline was a claim about every line in the repository.
    "E501", # [behavioural] Line too long (configured at 100)
            # What is left of that argument, and it does not reduce the same way.
            # Unlike the two above there is no autofix, so acting on a finding is a
            # hand-rewrite rather than deleting a space nothing can observe.
            #
            # Where the 200 findings actually are, classified with a 3.12-aware
            # tokenizer (f-strings tokenize as FSTRING_START..FSTRING_END, not
            # STRING; reading STRING alone finds only 130 of them and understates
            # the case by 60): 190 sit inside a string token, 27 of them spanning
            # multiple lines, and only 10 in 9 files are outside a string token
            # entirely. So the decline is argued on where its findings are,
            # not on the limit: the multi-line 27 are literal text whose width is
            # content, while the single-line 163 are the weaker half of the case --
            # shortening one of those is an ordinary refactor. That is the part to
            # re-read if this entry is ever revisited, and re-measure rather than
            # trusting these numbers, which are true of one tree on one day.
            #
            # Its old reason -- "already configured at 100" -- described the limit
            # rather than the decline, which is the shape a category marker with no
            # required argument leaves undisturbed.

    # Type annotations — covered by mypy, which measures the same property with teeth.
    # `disallow_untyped_defs` is what the strict tier turns on, and `no-untyped-def`
    # is the largest single family in the type backlog. The cover is conditional in
    # exactly the way RUF013's is: it has a hole where mypy is `unchecked`, and that
    # hole closes by promoting those cells, not by re-selecting this family.
    "ANN001", # [covered-elsewhere] mypy `no-untyped-def` — function argument
    "ANN002", # [covered-elsewhere] mypy `no-untyped-def` — *args. The same signature
              # as ANN003 below, in its other spelling. Declining one and enforcing
              # the other asks a `def f(*args, **kwargs)` to annotate half of itself.
    "ANN003", # [covered-elsewhere] mypy `no-untyped-def` — **kwargs
    "ANN201", # [covered-elsewhere] mypy `no-untyped-def` — public function return
    "ANN202", # [covered-elsewhere] mypy `no-untyped-def` — private function return
    "ANN204", # [covered-elsewhere] mypy `no-untyped-def` — special method return
    "ANN205", # [covered-elsewhere] mypy `no-untyped-def` — staticmethod return
    "ANN206", # [covered-elsewhere] mypy `no-untyped-def` — classmethod return. ANN205's
              # direct sibling, added because seven of this family's nine members were
              # already declined here and the two left standing were the odd
              # spellings rather than a policy about classmethods and *args.
    "ANN401", # [covered-elsewhere] mypy — whether a signature may widen to `Any` is
              # the per-cell tier question mypy already answers; this rule would
              # answer it repo-wide and in one direction.

    # Import location - often necessary for circular deps
    "PLC0415", # [behavioural] Import should be at the top-level of a file
               # Moving a function-level import to module scope changes when the
               # module is evaluated, and can close an import cycle that the local
               # placement was there to keep open. The argument is already in this
               # file: I001 is declined [behavioural] on the grounds that "this
               # repository carries enough circular-dependency pressure to decline
               # PLC0415 over it, across 1,949 sites". Both cannot be true. That
               # entry has it right, and this one was reading its own rule name.

    # Type-checking imports — NOT presentational. Moving an import into a
    # `TYPE_CHECKING` block removes it at runtime, and anything that evaluates
    # annotations at runtime then fails: Pydantic models, dataclasses read through
    # `get_type_hints`, and every `TypeAdapter` in the tree.
    "TC001", # [behavioural] Move application import into type-checking block
             # The same runtime-evaluation hazard as TC002, reached through a
             # first-party import.
    "TC002", # [behavioural] Move third-party import into type-checking block
             # The hazard is a property of the *library*, not of the count: the three
             # findings today are `import pytest`, but the next one could be pydantic,
             # which resolves annotations at runtime. A low count does not bound it.
    "TC003", # [behavioural] Move standard library import into type-checking block
             # Same mechanism again; `datetime` and `decimal` are both resolved at
             # runtime by the validation layers above them.

    # Code simplification - sometimes less readable
    "SIM102", # [presentational] Use a single if statement instead of nested if
              # Unsafe for a reason that is not about this code at all: ruff marks
              # the fix safe under preview and unsafe otherwise, and preview is off
              # here. `if a: if b:` and `if a and b:` short-circuit identically.
              # 23 findings.
    "SIM103", # [behavioural] Return negated condition directly
              # ruff marks this fix unsafe in its own words: it "may change the
              # program's behavior if the condition does not return a proper
              # Boolean", and a custom __eq__ can dodge even the bool() wrapper the
              # fix inserts. Nine findings, seven of them carrying an unsafe fix.
    "SIM110", # [presentational] Use return any() instead of for loop
              # ruff: "always marked as unsafe because it might remove comments".
              # Losing a comment is a loss to the reader, not a difference the
              # program can observe -- `any()` short-circuits exactly as the loop
              # it replaces does. 4 findings.
    "SIM118", # [behavioural] Use `key in dict` instead of `key in dict.keys()`
              # ruff marks the fix safe only "when the type of obj is known to be a
              # dictionary; otherwise, it is marked as unsafe" -- and all 13 findings
              # here are the unsafe kind. On anything that is not a dict, `in` asks
              # __contains__ and `.keys()` asks whatever that method returns, which
              # are not required to agree.
    "SIM105", # [presentational] Use contextlib.suppress
              # 38 findings carry an unsafe fix. Driven on a real site to see what
              # the fix does rather than inferred: it rewrites try/except/pass into
              # `with contextlib.suppress(...)` and inserts the import -- same
              # exception caught, same statements skipped. What it disturbs is the
              # comment in the except body and the import block's order, and I001
              # is declined separately.
    "SIM108", # [presentational] Use ternary operator instead of if-else-block
              # 33 findings carry an unsafe fix. Driven on a real site, the rewrite
              # is `x = a if cond else b` from the four-line form -- one expression,
              # same branch taken, same object bound. The unsafety is comment
              # placement, which the site it was checked against kept intact.
    # SIM115 was declined here with the reason "not practical for locks", and
    # that reason is true -- of one file: data's file backend holds a lock handle
    # open across the critical section it protects, which is exactly the shape
    # the rule cannot tell from a leak. Thirteen files in all own a handle past
    # the expression that opens it. Declining repo-wide to accommodate them turned
    # the check off for everything else, and a leaked handle in bin/package-hashes.py
    # then had to be found by reading the file. Moved to per-file-ignores below,
    # one entry per file with its own reason, so a fourteenth has to argue for
    # itself instead of arriving under a waiver written for something else.
    "SIM117", # [presentational] Use single with statement with multiple contexts

    # Complexity metrics - already configured
    "PLR0911", # [presentational] Too many return statements (configured at 6)
    "PLR0912", # [presentational] Too many branches (configured at 12)
    "PLR0913", # [presentational] Too many arguments to function call
    "PLR0917", # [presentational] Too many positional arguments (same family as PLR0913;
               # project accepts many-parameter constructors/builders)
    "PLR0915", # [presentational] Too many statements (configured at 50)
    "PLR2004", # [presentational] Magic value used in comparison
    "PLR5501", # [presentational] Use elif instead of else-if - style preference
    "PLR1714", # [behavioural] Consider merging multiple comparisons
               # ruff: "always unsafe since literal sets and tuples evaluate their
               # members eagerly whereas `or` comparisons are short-circuited",
               # so a fix changes behaviour wherever a member has side effects or
               # is expensive. Eleven findings, all of them the unsafe kind.

    # Unused arguments — "the signature belongs to the interface" is an argument
    # rather than the absence of one, and every member here can equally be a
    # parameter someone forgot to use. So each carries its own line.
    "ARG001", # [behavioural] Unused function argument
              # Callback and handler signatures are fixed by whoever calls them.
    "ARG002", # [behavioural] Unused method argument
              # An override must match its base signature whether or not it uses it.
    "ARG003", # [behavioural] Unused classmethod argument — the same "the signature
              # belongs to the interface" case as the other three in this block,
              # reached through a classmethod rather than a function, method or
              # staticmethod.
    "ARG004", # [behavioural] Unused static method argument
              # The same case again, reached through a staticmethod.
    "ARG005", # [behavioural] Unused lambda argument — admitted by analogy rather than by family,
              # and the only decline here that is. ARG003, ANN002, ANN206 and PTH108
              # each close a gap between numbered siblings spelling one case two ways,
              # where enforcing the rare spelling of a declined rule decides nothing.
              # This is a separate rule let in under the same "the signature belongs
              # to the interface" reason, and it is the one with something to lose: an
              # unused lambda argument can also be a miswritten key/sort/filter
              # callback, which a spelling variant cannot be. Declined anyway because
              # it had already been declined by hand four times in src/ before this
              # line existed: a lambda whose signature is the caller's API and whose
              # body is deliberately match-everything (`find_nodes(lambda n: True)`)
              # or a no-op passthrough. Those four `# noqa` directives are gone; this
              # line is the decision they were each making locally.

    # Type checking upgrades
    "UP006", # [presentational] Use `dict` instead of `Dict` for type annotations
    "UP007", # [presentational] Use `X | Y` for union types
    "UP028", # [behavioural] Replace yield over for loop with yield from
             # `yield from` forwards send() and throw() to the inner generator. These
             # generators expose neither, so the rewrite widens their contract.
    "UP035", # [presentational] Deprecated typing imports

    # Import formatting — NOT cosmetic in this tree. Reordering top-level imports
    # changes import-time evaluation order, and this repository carries enough
    # circular-dependency pressure to decline PLC0415 over it, across 1,949 sites.
    "I001", # [behavioural] Import block is un-sorted or un-formatted
            # `ruff format` does not sort imports, so nothing else covers this either.

    # Path migration — gradual transition; os.* and Path.* are equivalent at these
    # call sites, and the family moves together or not at all.
    "PTH103", # [presentational] Use Path.mkdir()
    "PTH105", # [presentational] Use Path.replace()
    "PTH107", # [presentational] Use Path.unlink()
    "PTH108", # [presentational] Use Path.unlink() — os.unlink is an alias of os.remove
              # in CPython, one syscall under two names. PTH107 above declines the one;
              # the two cannot coherently sit on opposite sides of this list.
    "PTH110", # [presentational] Use Path.exists()
    "PTH120", # [presentational] Use Path.parent
    "PTH123", # [presentational] open() should be replaced by Path.open()
    "PTH202", # [presentational] Use Path.stat().st_size

    # Other style preferences
    "E721", # [behavioural] Use isinstance() instead of type comparison
            # ruff's own documentation is explicit that the rewrite changes behaviour
            # under NumPy, Pandas and SQLAlchemy, where `__eq__` on a type is
            # overloaded and `type(x) == T` is not `isinstance(x, T)`.
    "RUF005", # [behavioural] Consider unpacking instead of concatenation
              # ruff: the fix is "always marked as unsafe because the `+` operator
              # uses the __add__ magic method and `*`-unpacking uses __iter__. Both
              # of these could have custom implementations, causing the fix to change
              # program behaviour." Not abstract here -- NPY is in select, and for an
              # array `a + [b]` is elementwise addition while `[*a, b]` builds a list.
              # 22 findings, 21 carrying an unsafe fix.
    "RUF013", # [covered-elsewhere] mypy's implicit-Optional check, which is on by
              # default. 39 of the 42 findings are in src/; the 3 outside sit in cells
              # mypy leaves unchecked, so this cover has the same hole the ANN block
              # has, and it closes the same way.
    "RUF022", # [presentational] __all__ is not sorted
              # ruff marks the fix unsafe only "if there are any comments that take
              # up a whole line by themselves inside the __all__ definition", which
              # is what the 43 unsafe findings here are. Reordering the names
              # themselves changes nothing: __all__ decides which names `import *`
              # binds, not the order anything is defined or evaluated in.
    # Modernizations deliberately declined — each would change a public API,
    # not just syntax. Revisit individually, not as a sweep.
    "ASYNC109",  # [behavioural] `timeout` parameter on an async def. For a Protocol defining
                 # a cross-backend contract the parameter *is* the interface,
                 # and a DB-backed implementation forwards it rather than
                 # timing out client-side. The blocking-I/O members of this
                 # family (ASYNC210 / 230 / 240 / 251) remain enforced.
    "UP040",     # [behavioural] `type` statement over `TypeAlias`: creates a lazy
                 # TypeAliasType, changing introspection of published aliases.
    "UP042",     # [behavioural] StrEnum over (str, Enum): changes str()/f-string
                 # rendering of published members from `Class.MEMBER` to the value.
    "UP046",     # [behavioural] PEP 695 *class* type parameters: infers variance on the seven
                 # Protocol TypeVars that declare it (InboxT_co, OutboxT_contra,
                 # KeyT_contra, ValueT_co, InputT_contra, KindT_co, T_co), and
                 # would scope ConfigT to its class though __all__ exports it.
    "UP047",     # [behavioural] PEP 695 *function* type parameters — a different rule with a
                 # different reason: none of its candidates is a Protocol, but
                 # several share a TypeVar with a class in the same module
                 # (SpecT, by PackRegistry and compose_packs), and a
                 # per-function rewrite would fragment the shared name.
]

# Characters RUF001-003 would otherwise report as homoglyphs. The Greek letters
# are mathematical notation; "ℹ" is the information emoji used as a status
# prefix by the CLI tools in bin/, alongside "✅" and "⚠️" — deliberate output,
# and the reason this setting exists rather than a per-file suppression.
allowed-confusables = ["α", "β", "γ", "δ", "ε", "θ", "λ", "μ", "σ", "φ", "ω", "ℹ"]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore certain errors in specific files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "F401"]  # D104 (missing package docstring) can only fire on an __init__.py, so this line is now the whole of that rule's suppression rather than a duplicate of a repo-wide decline; F401 covers the re-export imports
"packages/legacy/*" = ["D", "N", "UP"]  # Relax rules for legacy code
# Two entries were deleted here because each waived nothing, and one of them read
# as though it did. `"tests/*" = ["D100", "D101", "D102", "D103", "S101"]` looked
# like the docstring waiver for the test suites; it was not, for three compounding
# reasons — these patterns are anchored at the project root, so it never reached
# `packages/*/tests` at all; `D100`-`D103` are declined globally above; and `S`
# (flake8-bandit) is not in `select`, so `S101` cannot fire. Measured: the tree
# reports the same count with the line and without it. `"*.ipynb" = [...]` waived
# rules in notebooks, and the repository tracks no notebook.
# ASYNC false positives — verified cheap one-shot stats / poll loops, not hot-loop
# blocking I/O. These paths are repo-relative because this is now the only ruff
# config: the per-package sections these used to be mirrored into are gone, so
# there is one place to add the next one. See .claude/rules/async-transport.md.
"packages/data/src/dataknobs_data/vector/migration.py" = ["ASYNC110"]  # queue-drain poll; asyncio.sleep does not block the loop (style lint, not an I/O defect). Idiomatic Queue.join()/task_done() migration tracked separately
"packages/bots/src/dataknobs_bots/knowledge/service.py" = ["ASYNC240"]  # one-time ingest-setup path resolution (cwd + existence checks); setup-time, not a per-record hot path
"packages/fsm/src/dataknobs_fsm/io/adapters.py" = ["ASYNC240", "SIM115"]  # ASYNC240: cheap one-shot path stat at validate()-time; setup-time, not a hot-loop call. SIM115: handle stored on self.file_handle by open(), released by the paired close()
# ASYNC over test suites — a different argument from the three lines above, and a
# weaker one, so it is kept separate rather than folded into them. Those are false
# positives: the call is cheap and one-shot. These are true positives that starve
# nothing, because the loop is built for one test by pytest-asyncio (default test
# loop scope `function`) and torn down after it, so the co-tenant the rule exists
# to protect does not exist. Every entry below was read first and meets all three
# conditions in .claude/rules/async-transport.md — function-scoped loop, no
# concurrency in the enclosing `async def` (checked across all 91 sites: zero use
# gather/create_task/TaskGroup), and the call is the test's own scaffolding rather
# than its subject.
#
# Codes are named per file, never bare `ASYNC`: a file waived for ASYNC230 still
# reports a `time.sleep` or a `subprocess.run` added to it later. The cost of the
# per-file form is that a FUTURE blocking call of the named code in the named file
# also goes unreported — accepted per file, not per directory. `time.sleep` was
# fixed rather than waived (nine sites), and the four suites whose SUBJECT is
# blocking take per-line `# noqa` instead, so that the check stays live over
# exactly the code most likely to need it.
"packages/fsm/tests/test_file_utils.py" = ["ASYNC230"]  # 15 fixture writes building the files the readers then read; the readers' own async-correctness is proven separately by test_file_utils_offload.py
"packages/fsm/tests/test_streaming_file_utils.py" = ["ASYNC230"]  # 19 fixture writes, same shape; the streaming readers are proven non-blocking by test_streaming_file_utils_offload.py
"packages/fsm/tests/test_end_to_end_streaming_example.py" = ["ASYNC230", "ASYNC240"]  # 27 input-file writes, output readbacks and unlink teardown; process_stream itself is driven inside assert_no_blocking() by test_fsm_execution_offload.py
"packages/fsm/tests/test_io_abstraction.py" = ["ASYNC240"]  # three `finally:` unlinks of the temp file the test wrote
# test_database_storage_factory.py belongs to this group too — three `finally:`
# exists/unlink pairs cleaning up a SQLite temp file — but it already holds a
# SIM115 entry, and a key may appear once. Its ASYNC240 is merged into that line
# in the SIM115 block below, the way io/adapters.py above carries both codes.
"packages/fsm/tests/test_execution_real.py" = ["ASYNC240"]  # one `finally:` unlink of a temp config file
"packages/data/tests/test_backends/test_file.py" = ["ASYNC240"]  # four fixture-teardown removes plus two assertions that the backend created its file; the fixture that needed no loop at all was made sync instead of waived
"packages/data/tests/test_backends/test_file_edge_cases.py" = ["ASYNC240"]  # one `finally:` cleanup of a file and its .gz sibling
"packages/data/tests/test_file_temp_default.py" = ["ASYNC240"]  # four existence assertions — the temp-file lifecycle is what this suite asserts, so the stats are the test's subject-matter, not I/O it performs incidentally
"packages/data/tests/test_vector_stores.py" = ["ASYNC230"]  # one pickle write constructing a legacy-format store to load
"packages/data/tests/vector/stores/test_update_metadata_where.py" = ["ASYNC230"]  # a pickle read/write pair that downgrades a fixture to the legacy shape under test
"packages/data/tests/vector/stores/test_faiss_filtered_search.py" = ["ASYNC230"]  # a pickle read/write pair rewriting a saved .meta into the pre-side-car shape the fallback path exists for. Scaffolding, not the subject: the store's own persistence is driven inside assert_no_blocking() by test_faiss_async_offload.py, and search is what this file asserts on. Function-scoped loop (no widening in packages/data), no concurrency scheduled
"packages/data/tests/examples/test_vector_multi_backend.py" = ["ASYNC240"]  # one `finally:` unlink
"packages/bots/tests/test_knowledge.py" = ["ASYNC230", "ASYNC240"]  # two fixture writes plus three assertions that the KB persisted to disk
"packages/bots/tests/test_knowledge_service.py" = ["ASYNC240"]  # two write_text calls creating the documents to be ingested
"packages/xization/tests/ingestion/test_document_source.py" = ["ASYNC240"]  # one is_file() inside the comprehension that builds the expected set to compare against
"tests/test_package_interop.py" = ["F401"]  # an import smoke test: the import IS the assertion, so "unused" is the subject rather than a defect
# SIM115 — the twelve files that own a handle past the expression that opens
# it, which is the one shape the rule cannot distinguish from a leak. Scoped here
# rather than declined repo-wide (see the note beside SIM117 above). Each was
# read before being listed; a thirteenth needs its own line and its own reason.
"packages/data/src/dataknobs_data/backends/file.py" = ["SIM115"]  # the case the global waiver was written for: a lock handle held open across the critical section it protects (msvcrt.locking on its fileno), plus a NamedTemporaryFile used for its path
"packages/data/tests/test_cross_backend_integration.py" = ["SIM115"]  # NamedTemporaryFile kept on the fixture for the test's lifetime
"packages/data/examples/vector_multi_backend.py" = ["SIM115"]  # NamedTemporaryFile(delete=False) opened for its name; closed on the next line
"packages/fsm/src/dataknobs_fsm/resources/filesystem.py" = ["SIM115"]  # NamedTemporaryFile handed to a caller as a managed resource; the pool closes it
"packages/fsm/src/dataknobs_fsm/streaming/file_stream.py" = ["SIM115"]  # handle stored on self._file_handle for the stream's lifetime, closed by close()
"packages/fsm/src/dataknobs_fsm/utils/file_utils.py" = ["SIM115"]  # lazily-opened CSV accumulator held across write_csv() calls via nonlocal
"packages/fsm/src/dataknobs_fsm/utils/streaming_file_utils.py" = ["SIM115"]  # same self._file_handle streaming-writer shape as file_stream.py
"packages/fsm/tests/test_database_storage_factory.py" = ["SIM115", "ASYNC240"]  # SIM115: NamedTemporaryFile(delete=False) opened for its path; closed on the next line. ASYNC240: three `finally:` exists/unlink pairs cleaning up that temp file — the test-suite ASYNC group above, merged here because a key may appear only once
"packages/utils/src/dataknobs_utils/json_utils.py" = ["SIM115"]  # ownership switches on the argument type: opened here only when passed a path, and then closed here
"packages/utils/src/dataknobs_utils/xml_utils.py" = ["SIM115"]  # handle must outlive the expression because mmap borrows its fileno()
"packages/xization/src/dataknobs_xization/ingestion/source.py" = ["SIM115"]  # handle crosses a thread boundary to a generator that finalizes it

[tool.ruff.lint.isort]
# Configure import sorting
combine-as-imports = true
force-wrap-aliases = true
# `dataknobs_workspace` and `tests` are first-party too: the workspace shim and
# the guard suite that checks the toolchain. Named explicitly rather than left to
# `src` resolution because that only fires for a directory ruff can see from the
# file being checked, and these are imported from every package tree as well.
# `dataknobs_fsm` was the one package name missing here while the five
# per-package sections existed, and it was invisible from either side: root
# ignores I001, so nothing sorted imports under this config, while fsm's own
# section named itself first-party and did not. Consolidating removed the
# second answer, which would have left the omission as the only one.
known-first-party = ["dataknobs", "dataknobs_common", "dataknobs_config", "dataknobs_data", "dataknobs_fsm", "dataknobs_llm", "dataknobs_bots", "dataknobs_structures", "dataknobs_utils", "dataknobs_xization", "dataknobs_workspace", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google docstring convention

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_workspace"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
