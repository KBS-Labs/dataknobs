# osv-scanner configuration — accepted advisories.
#
# osv-scanner reads this file automatically for any lockfile in this
# directory, so it applies to both audits in
# .github/workflows/dependency-update.yml and to bin/audit-floor.sh.
#
# An entry belongs here only when ALL of these hold (policy:
# docs/development/dependency-updates.md, "Accepting an Advisory With No Fix"):
#
#   1. No fixed version exists — a floor bump cannot clear it.
#   2. The flawed code path is not reachable from this workspace.
#   3. The declaring pyproject.toml carries the full triage as an inline
#      comment on the dependency, and `reason` below points at it.
#   4. `ignoreUntil` is at most 90 days out, so the scanner resurfaces the
#      advisory for re-triage instead of hiding it indefinitely.
#
# When upstream ships a fix, delete the entry and bump the floor instead.

