name: Quality Validation

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if quality-relevant files were changed
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      docs-changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
              - 'setup.py'
              - 'setup.cfg'
              - '.pre-commit-config.yaml'
              - 'bin/**'
              - 'tests/**'
              # Toolchain declarations. An unprefixed 'pyproject.toml' matches
              # the root file only, so without these a change to a package's
              # lint target, type-checker target, or classifiers skipped this
              # job entirely — including any change that reverts one. The
              # workspace guards assert against every file listed here, and
              # they cannot run on a job that does not start.
              - 'packages/*/pyproject.toml'
              - 'mypy.ini'
              - 'pytest.ini'
              - '.python-version'
              - '.pylintrc'
              # Shell scripts at the repository root. The '**/*.py' and 'bin/**'
              # patterns above reach neither, and the shell lint reports on both
              # — so a change to one moves the recorded shell_lint verdict while
              # skipping the job that would have recomputed it.
              - 'run_api.sh'
              - 'setup-dk.sh'
              # Documentation inputs. The gate records three checks over these
              # — the site build, the version-table sync, and the dual-docs
              # mirror — so a change to one moves a recorded verdict, exactly
              # as a change to a linted script does. Without these patterns a
              # documentation-only pull request skipped this job, and the docs
              # job below skips its own build when no hash is dirty, so both
              # accepted a verdict computed over different content.
              #
              # Unlike the docs filter below, index.md and installation.md are
              # not excluded here: they are what the version-table check reads,
              # so a change to either is precisely what needs revalidating.
              - 'docs/**'
              - 'mkdocs.yml'
              - 'packages/*/docs/**'
              - '.dataknobs/*.json'
              # Every workflow, this file among them. Two reasons that arrive
              # at the same pattern:
              #
              # This file, because a pull request whose only change deletes the
              # patterns above would otherwise match nothing, skip the sole
              # PR-time quality job, and report green — leaving every
              # declaration above untriggered from that merge forward.
              #
              # All of them, because the gate records a workflow_lint verdict
              # and these files are its entire input. Naming this one alone
              # meant a change to any other moved that verdict while skipping
              # the job that would have recomputed it — the same gap the two
              # root shell scripts above were added to close.
              - '.github/workflows/**'
              # Inputs to recorded checks that are neither code nor
              # documentation, so no pattern above reaches them: between them
              # these two decide what four of the workspace guards report.
              # (bin/internal-label-allowlist.txt is the third of that kind and
              # is deliberately absent — 'bin/**' already matches it.)
              - '.gitignore'
              - '.gitattributes'
            docs:
              - 'docs/**'
              - '!docs/changelog.md'
              - '!docs/index.md'
              - '!docs/installation.md'
              - 'mkdocs.yml'
              - 'packages/*/src/**/*.py'
              - '.github/workflows/docs.yml'

  validate-quality-artifacts:
    runs-on: ubuntu-latest
    name: Validate Quality Checks
    needs: check-changes
    if: needs.check-changes.outputs.code-changed == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true

    - name: Validate package references
      run: |
        echo "🔍 Validating package references..."
        uv run python bin/validate-package-references.py

    - name: Validate quality artifacts
      run: |
        echo "🔍 Validating quality check artifacts..."
        ./bin/validate-quality-artifacts.sh
    
    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: quality-artifacts
        path: .quality-artifacts/
        retention-days: 7
    
    - name: Comment on PR
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          if (context.issue && context.issue.number) {
            const [owner, repo] = context.payload.repository.full_name.split('/');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: owner,
              repo: repo,
            body: `## ❌ Quality Check Validation Failed

            The quality check artifacts are either missing, outdated, or show failing tests.

            **Please run the following command locally before pushing:**
            \`\`\`bash
            ./bin/run-quality-checks.sh
            \`\`\`

            This will:
            1. Start the required Docker services (PostgreSQL, Elasticsearch, LocalStack)
            2. Run all unit and integration tests
            3. Perform style checks with ruff
            4. Generate coverage reports
            5. Create artifacts in \`.quality-artifacts/\` that must be committed

            For more information, see [Quality Checks Guide](../blob/main/docs/development/quality-checks.md)`
            })
          }

  build-docs:
    runs-on: ubuntu-latest
    name: Build Documentation
    needs: check-changes
    if: needs.check-changes.outputs.docs-changed == 'true'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # Full history for git revision date plugin

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true
        version: "latest"

    - name: Check for quality-relevant changes
      id: hash-check
      run: |
        # --no-project: package-hashes.py is stdlib-only, so we don't need
        # to sync the workspace just to run the skip probe.
        PY="uv run --no-project python"
        RESULT=$($PY bin/package-hashes.py validate --json 2>/dev/null) || true
        VALID=$(echo "$RESULT" | $PY -c "import sys, json; print(json.load(sys.stdin).get('valid', False))" 2>/dev/null || echo "False")
        DIRTY=$(echo "$RESULT" | $PY -c "import sys, json; print(','.join(json.load(sys.stdin).get('dirty_packages', [])))" 2>/dev/null || echo "")
        if [ "$VALID" = "True" ] && [ -z "$DIRTY" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "ℹ️ No quality-relevant source changes — skipping docs build"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: steps.hash-check.outputs.skip != 'true'
      run: uv sync --all-packages

    - name: Build documentation
      if: steps.hash-check.outputs.skip != 'true'
      run: uv run mkdocs build --strict
      env:
        NO_MKDOCS_2_WARNING: "1"

    - name: Upload documentation artifacts
      if: always() && steps.hash-check.outputs.skip != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: documentation-build
        path: ./site/
        retention-days: 7

  # Summary job that always runs to provide a consistent PR check
  all-checks-complete:
    runs-on: ubuntu-latest
    name: All Checks Complete
    needs: [check-changes, validate-quality-artifacts, build-docs]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Checking results of all jobs..."
          echo "Code changed: ${{ needs.check-changes.outputs.code-changed }}"
          echo "Docs changed: ${{ needs.check-changes.outputs.docs-changed }}"
          echo "Quality validation: ${{ needs.validate-quality-artifacts.result }}"
          echo "Build docs: ${{ needs.build-docs.result }}"

          # Fail if any required job failed (not skipped)
          if [[ "${{ needs.validate-quality-artifacts.result }}" == "failure" ]]; then
            echo "❌ Quality validation failed"
            exit 1
          fi

          if [[ "${{ needs.build-docs.result }}" == "failure" ]]; then
            echo "❌ Documentation build failed"
            exit 1
          fi

          # Check if any checks ran
          if [[ "${{ needs.check-changes.outputs.code-changed }}" == "true" ]] || [[ "${{ needs.check-changes.outputs.docs-changed }}" == "true" ]]; then
            echo "✅ All required checks passed"
          else
            echo "ℹ️  No code or documentation changes detected - skipping quality checks"
          fi
