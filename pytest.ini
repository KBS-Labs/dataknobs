[pytest]
# Test discovery
# `tests` holds workspace-level guards that belong to no package (toolchain
# declarations, the doc-mirror manifest). Without it here a bare `pytest` at
# the root skips them silently.
testpaths = packages tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: marks tests as integration tests (requires external services)
    slow: marks tests as slow running
    unit: marks tests as unit tests (no external dependencies)
    s3: marks tests as requiring S3/LocalStack
    postgres: marks tests as requiring PostgreSQL
    elasticsearch: marks tests as requiring Elasticsearch
    ollama: marks tests as requiring Ollama LLM server

# Default options. Neither of these is a coverage setting, whatever the header
# said for the two years this block carried one.
#
# --import-mode is mirrored into every package's [tool.pytest.ini_options] for
# the same reason asyncio_mode below is: only one of the two configurations
# applies to a given run, and which one is decided by the argument list. While
# they disagreed, the same file was imported by different rules depending on
# whether a second package was named — and neither configuration said so.
addopts =
    --import-mode=importlib
    -ra

# Async test support — match per-package pyproject.toml settings so that
# cross-package test runs (e.g. pytest packages/bots packages/llm) use
# the same asyncio mode as single-package runs.
asyncio_mode = auto

# Console output
console_output_style = classic

# Ignore patterns
norecursedirs = .git .tox dist build *.egg .uv-cache __pycache__ .venv