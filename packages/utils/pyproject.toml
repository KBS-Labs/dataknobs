[project]
name = "dataknobs-utils"
version = "2.0.2"
description = "Utility functions for dataknobs packages"
readme = "README.md"
authors = [
    { name = "Spence Koehler", email = "KoehlerSB747@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "dataknobs-common>=3.2.0",
    "dataknobs-structures>=1.0.17",
    "pandas>=1.3.0",
    "requests>=2.33.0",  # PYSEC-2023-74, GHSA-9hjg-9r4m-mvj7, GHSA-9wx4-h78v-vm56, GHSA-gc5v-m9x4-r6x2 fixed by 2.33.0
    "psycopg2-binary>=2.9.10",  # 2.8.6/2.9.9 lack cp312/cp313 wheels; source build needs pg_config
    "lxml>=6.1.0",  # PYSEC-2020-62, PYSEC-2021-19, PYSEC-2021-852, PYSEC-2022-230, GHSA-vfmq-68hx-4jfw fixed by 6.1.0
    "beautifulsoup4>=4.9.0",
    "json-stream>=2.3.0",
    "python3-nmap>=1.5.0",
    "python-dotenv>=1.2.2",  # GHSA-mf9w-mj56-hr94 fixed in 1.2.2
    "nltk>=3.10.4",  # GHSA-8mgp-746c-j5xp / PYSEC-2026-3740 / CVE-2026-81726 (CVSS 8.3, model-artifact APIs — TransitionParser.train/parse, AveragedPerceptron.save/load, PerceptronTagger.save_to_json, save_maxent_params — used raw open() on caller-controlled paths, reading/writing outside the roots nltk pathsec allows) fixed in 3.10.4, whose model save/load methods accept destinations inside a data root only; the GHSA record (last_affected=3.10.3) is the accurate one, the PYSEC record's fixed=3.10.3 is not. Not reachable here (none of those entry points is called in this workspace), but the floor moves for consumers. 3.10.4 also makes every data root refuse paths outside nltk.data.path; resource_utils only downloads into and reads from the directory it appends to nltk.data.path, so its wordnet/omw-1.4/wordnet_ic loads stay inside a data root. Extends the prior >=3.10.3 floor: 16 advisories fixed in 3.10.3 (highest CVSS 9.8: PYSEC-2026-3749 / GHSA-m4rf-3fr8-xwx3): PYSEC-2026-3733, PYSEC-2026-3735, PYSEC-2026-3736, PYSEC-2026-3737, PYSEC-2026-3738 / GHSA-ww6m-cw3f-q94g, PYSEC-2026-3739 / GHSA-cw6x-m8jw-qmrh, PYSEC-2026-3741 / GHSA-f794-5jv7-7672, PYSEC-2026-3748, PYSEC-2026-3749 / GHSA-m4rf-3fr8-xwx3, PYSEC-2026-3751, PYSEC-2026-3752, PYSEC-2026-3790 / GHSA-cv22-g7mw-8v73, GHSA-5gh2-94qg-qppq, GHSA-6hwm-xvph-95vm, GHSA-ff5c-cp5c-9wjf, GHSA-vp2x-qp44-57v7. Extends the prior >=3.10.2 floor: 3.10.1 shipped an import-security hook (nltk/inisec.py) that blocked any module resolving under the current working directory, without excluding an in-tree virtualenv: with the venv inside the project (uv's default layout) it broke `import regex` for every nltk-initiated import, and with cwd=/ it blocked the stdlib. The documented PYTHONSAFEPATH workaround does not help, because the check is path-containment, not sys.path membership. 3.10.2 removes the module. GHSA-p4gq-832x-fm9v / PYSEC-2026-2078 / CVE-2026-54293 (CVSS 7.5, path traversal in nltk.data.find()/load() via percent-encoded (..%2f) sequences that bypass the ../ regex check once url2pathname() decodes them) fixed in 3.10.0; also keeps GHSA-rf74-v2fm-23pw, CVE-2026-33230, CVE-2026-33231 (fixed in 3.9.4). PYSEC-2026-597 / GHSA-m42h-3232-vpv3 / CVE-2026-12243 (CVSS 7.5, same path-traversal class) is cleared at this floor: OSV now records last_affected=3.9.4
]

[tool.uv.sources]
dataknobs-common = { workspace = true }
dataknobs-structures = { workspace = true }

[build-system]
# hatchling gained PEP 639 support (a bare-string `license` and a list-form
# `license-files`) in 1.27; both are declared above, so an older backend
# rejects this manifest rather than silently dropping the metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_utils"]
