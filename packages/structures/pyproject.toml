[project]
name = "dataknobs-structures"
version = "1.0.17"
description = "Data structures for AI knowledge bases"
readme = "README.md"
authors = [
    { name = "Spence Koehler", email = "KoehlerSB747@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "dataknobs-common>=3.2.0",
    "graphviz>=0.20.3",
    "pyparsing>=3.0.0",
    "pandas>=2.2.3",
]

[tool.uv.sources]
dataknobs-common = { workspace = true }

[build-system]
# hatchling gained PEP 639 support (a bare-string `license` and a list-form
# `license-files`) in 1.27; both are declared above, so an older backend
# rejects this manifest rather than silently dropping the metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_structures"]
