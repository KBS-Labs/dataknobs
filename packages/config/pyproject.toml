[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataknobs-config"
version = "0.4.4"
description = "Modular configuration system with composable settings and environment variable overrides"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "KBS Labs", email = "info@kbs-labs.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0.2",  # 6.0 lacks cp312/cp313 wheels and source build fails on Cython 3
    "dataknobs-common>=1.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=26.3.1",  # PYSEC-2024-48, GHSA-3936-cmfr-pm3m (CVSS 8.7) fixed by 26.3.1
    "flake8>=5.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Mirrors the root pytest.ini. Only one of the two configurations applies
# to any given run — this one when pytest is invoked on this package alone,
# the root when the invocation names anything else — so a value declared in
# one and not the other makes the argument list decide how modules are
# imported.
addopts = ["--import-mode=importlib"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py312']

[tool.uv.sources]
dataknobs-common = { workspace = true }