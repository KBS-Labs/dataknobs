[project]
name = "dataknobs-fsm"
version = "0.4.1"
description = "Finite State Machine framework with data modes, resource management, and streaming support"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "DataKnobs Team", email = "team@dataknobs.com"}
]
keywords = ["fsm", "state-machine", "workflow", "orchestration", "data-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "dataknobs-common>=3.0.0",
    "dataknobs-data>=0.9.0",
    "dataknobs-structures>=1.0.16",
    "dataknobs-utils>=2.0.1",
    "dataknobs-config>=0.6.0",
    "aiofiles>=23.0.0",
    "click>=8.3.3",  # PYSEC-2026-2132 / CVE-2026-7246 (CVSS 7.2, command injection via click.edit()) fixed in 8.3.3
    "rich>=13.0.0",
    "pyyaml>=6.0.2",  # 6.0 lacks cp312/cp313 wheels and source build fails on Cython 3
    "ijson>=3.2.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "langchain>=1.3.9",  # multiple langchain/langchain-core/langchain-community CVEs (highest CVSS 9.3: GHSA-c67j-w6g6-q2cm) fixed by the langchain 1.x line; GHSA-gr75-jv2w-4656 (CVSS 5.1) still affects 1.0.0–1.3.8 and is fixed in 1.3.9. We only declare this as a convenience extra and do not import it
]
http = [
    "httpx>=0.27.0",  # GHSA-vqfr-h8mv-ghfj in transitive h11<0.16 (CVSS 9.1) swept by httpcore 1.x (required by httpx>=0.27)
    "aiohttp>=3.14.3",  # extends the prior <=3.13.3 sweep (highest CVSS 9.1: GHSA-63hf-3vf5-4wqf) and the >=3.14.1 floor through the 3.14.2 / 3.14.3 advisories. GHSA-cq5v-8q36-5273 / CVE-2026-69244 (CVSS 7.1, out-of-bounds heap read in the C response parser's malformed-chunked error path -> client-side DoS) is fixed in 3.14.3 and is the one reachable finding: every aiohttp call site in this workspace is an outbound ClientSession parsing server responses, and the AIOHTTP_NO_EXTENSIONS=1 workaround is not set. Also sweeps two 3.14.2 fixes triaged unreachable — GHSA-mfx4-hv73-q22v / CVE-2026-69243 (CVSS 6.3, request smuggling via WebSocket upgrade, server-side component only; aiohttp.web appears solely in the in-process test server) and GHSA-mq44-7p77-q5h7 / CVE-2026-59881 (CVSS 6.9, WebSocket client decompresses RSV1 frames without negotiated permessage-deflate; no ws_connect call sites exist). Retains the prior 3.14.1 coverage of GHSA-hg6j-4rv6-33pg (CVSS 6.6, per-request cookies= cross-origin leak) and GHSA-jg22-mg44-37j8 (CVSS 6.4, CookieJar.load() deserialization), both unreachable (outbound HTTP uses header-based auth; CookieJar.load() is not invoked).
]
# `dataknobs-fsm[postgres]` covers the Postgres-backed database surface:
# `DatabaseResource` / `StorageBackend.POSTGRES` / `DatabaseETL` and the
# `backend: postgres` config path in the simple + async APIs, all of which
# run through dataknobs-data's backends.  Forwarding to that package's
# extra keeps the psycopg2 / sqlalchemy / asyncpg floors in a single place
# rather than re-pinning the drivers here.  Unlike `dataknobs-bots`, this
# package does not reach dataknobs-common's Postgres lock or event bus —
# the `PostgresEventBus` mention in `resources.pool` is a docstring
# analogy for the constructor shape, not a dependency.
postgres = [
    "dataknobs-data[postgres]",
]
# One narrow extra per vector store, so a consumer installs exactly the
# store it uses — reaching FAISS or pgvector no longer drags in chromadb,
# which carries an unfixed advisory (documented at the dataknobs-data
# declaration).  Each forwards to dataknobs-data, which owns the stores
# and therefore their dependency floors; re-pinning the drivers here
# would give the same floor two homes to drift between.
chroma = [
    "dataknobs-data[chroma]",
]
faiss = [
    "dataknobs-data[faiss]",
]
pgvector = [
    "dataknobs-data[pgvector]",
]
# Back-compat roll-up: `dataknobs-fsm[vector]` keeps resolving to every
# vector backend, so existing installs are unaffected by the split.
vector = [
    "dataknobs-fsm[chroma,faiss,pgvector]",
]
all = [
    "dataknobs-fsm[llm,http,postgres,vector]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=26.3.1",  # PYSEC-2024-48, GHSA-3936-cmfr-pm3m (CVSS 8.7) fixed by 26.3.1
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "markdown>=3.8.1",  # GHSA-5wmx-573v-2qwq (XSS, CVSS 7.5) fixed in 3.8.1 — transitive via mkdocs-material; explicit floor required
    "pymdown-extensions>=11.0.1",  # GHSA-gm37-52c6-37mw / CVE-2026-67422 (exponential-backtracking ReDoS in the caret/tilde/betterem/magiclink inline processors, CVSS 7.5) fixed in 11.0.1; extends the prior >=11.0.0 floor (GHSA-9xwg-3r6f-jcx2 / CVE-2026-61632, CVSS 5.3) and sweeps GHSA-62q4-447f-wv8h (CVSS 4.3, 10.21.3) and GHSA-r6h4-mm7h-8pmq (CVSS 2.7, 10.16.1) — transitive via mkdocs-material; explicit floor required
]

[project.scripts]
fsm = "dataknobs_fsm.cli:main"

[project.urls]
"Homepage" = "https://github.com/dataknobs/dataknobs"
"Bug Tracker" = "https://github.com/dataknobs/dataknobs/issues"
"Documentation" = "https://dataknobs.readthedocs.io"

[tool.uv.sources]
dataknobs-data = { workspace = true }
dataknobs-structures = { workspace = true }
dataknobs-utils = { workspace = true }
dataknobs-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.8.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    # blockbuster powers the reproduce-first async-blocking assertions
    # (assert_no_blocking from dataknobs-common) used by the file-processing
    # and streaming-file utility offload tests. Without it installed here
    # those assertions would skip instead of proving the readers/writers
    # keep the loop unblocked. Dev/test-only — never imported by shipped
    # runtime code.
    "blockbuster>=1.5.26,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_fsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Mirrors the root pytest.ini. Only one of the two configurations applies
# to any given run — this one when pytest is invoked on this package alone,
# the root when the invocation names anything else — so a value declared in
# one and not the other makes the argument list decide how modules are
# imported. `asyncio_mode` below is mirrored for the same reason.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow running",
    "database: marks tests that require database",
    "llm: marks tests that require LLM services",
    "streaming: marks tests for streaming functionality",
]

[tool.coverage.run]
source = ["src/dataknobs_fsm"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "openai.*",
    "anthropic.*",
    "langchain.*",
    "httpx.*",
    "aiohttp.*",
    "chromadb.*",
    "faiss.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
