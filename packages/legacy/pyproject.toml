[project]
name = "dataknobs"
version = "0.2.2"
description = "Useful implementations of data structures and design patterns for AI knowledge bases. (Legacy package - please use modular packages instead)"
readme = "README.md"
authors = [
    { name = "Spence Koehler", email = "KoehlerSB747@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "dataknobs-common==3.2.0",
    "dataknobs-structures==1.0.17",
    "dataknobs-utils==2.0.2",
    "dataknobs-xization==2.2.1",
]

[tool.uv.sources]
dataknobs-common = { workspace = true }
dataknobs-structures = { workspace = true }
dataknobs-utils = { workspace = true }
dataknobs-xization = { workspace = true }

[build-system]
# hatchling gained PEP 639 support (a bare-string `license` and a list-form
# `license-files`) in 1.27; both are declared above, so an older backend
# rejects this manifest rather than silently dropping the metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
