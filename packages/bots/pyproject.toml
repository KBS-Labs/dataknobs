[project]
name = "dataknobs-bots"
version = "0.9.4"
description = "Configuration-driven AI agents for DataKnobs"
readme = "README.md"
authors = [
    { name = "Spence Koehler", email = "KoehlerSB747@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dataknobs-common>=1.6.3",
    "dataknobs-config>=0.4.4",
    "dataknobs-llm>=0.6.9",
    "dataknobs-data>=0.7.0",
    "dataknobs-utils>=1.2.18",
    "dataknobs-xization>=1.3.14",
    "dataknobs-fsm>=0.3.3",
    "pyyaml>=6.0.2",  # 6.0 lacks cp312/cp313 wheels and source build fails on Cython 3
    "numpy>=1.24.0",
    "jinja2>=3.1.6",  # GHSA-cpwx-vrp4-4pq7, GHSA-gmj6-6f8f-6699, GHSA-h75v-3vvj-5mfj, GHSA-q2x7-8rv6-6q7h fixed by 3.1.6
    # jsonschema is lazy-imported by generators/base.py,
    # rubrics/executor.py and review/executor.py for parameter and
    # output schema validation.  Declaring it here keeps the runtime
    # import from raising ModuleNotFoundError in consumer envs.
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
# `dataknobs-bots[faiss]` brings in the FAISS vector backend selected by
# `backend: faiss` in vector memory (`memory.registry`) and RAG knowledge
# (`knowledge.rag`).  Forwards to dataknobs-data, which owns the store and
# its floor.  Deliberately the narrow `faiss` extra rather than
# `dataknobs-data[vector]`: the roll-up also pulls chromadb, which carries
# an unfixed pre-authentication code-injection advisory
# (GHSA-f4j7-r4q5-qw2c / PYSEC-2026-311, CVSS 9.3, no upstream fix as of
# 2026-08-05), plus pgvector, which only the Postgres-backed store needs.
faiss = [
    "dataknobs-data[faiss]",
]
# `dataknobs-bots[http]` brings in aiohttp for `HTTPRegistryBackend`
# in `registry.http_backend`.  The module lazy-imports aiohttp so the
# package still imports cleanly when the extra is not installed;
# callers that actually instantiate `HTTPRegistryBackend` must
# install this extra.  Declaring it here also puts the backend's
# transport under the floor audit — previously aiohttp reached
# consumers only transitively (via the `s3` extra's aioboto3 ->
# aiobotocore chain, or a sibling package's own extra), so no floor
# governed the version an `HTTPRegistryBackend` user actually got.
http = [
    "aiohttp>=3.14.3",  # matches the dataknobs-llm / dataknobs-fsm floors: GHSA-cq5v-8q36-5273 / CVE-2026-69244 (CVSS 7.1, out-of-bounds heap read in the C response parser's malformed-chunked error path -> client-side DoS) is fixed in 3.14.3 and is reachable here, since HTTPRegistryBackend is an outbound ClientSession parsing responses from a consumer-configured registry server and the AIOHTTP_NO_EXTENSIONS=1 workaround is not set. Also sweeps the 3.14.2 fixes GHSA-mfx4-hv73-q22v (CVSS 6.3, request smuggling via WebSocket upgrade, server-side component only) and GHSA-mq44-7p77-q5h7 (CVSS 6.9, WebSocket client RSV1 decompression without negotiated permessage-deflate; no ws_connect call sites), plus the prior <=3.14.1 sweep (highest CVSS 9.1: GHSA-63hf-3vf5-4wqf)
]
# `dataknobs-bots[postgres]` covers every Postgres-backed bots feature:
# the registry storage backends (`registry.create_registry_backend` /
# `DataKnobsRegistryAdapter`) via dataknobs-data, and the cross-replica
# ingest lock (`IngestOrchestrator` -> `create_lock({"backend":
# "postgres"})`) via dataknobs-common.  Forwarding to the owning
# packages' extras keeps the psycopg2 / sqlalchemy / asyncpg floors in a
# single place rather than re-pinning the drivers here.
postgres = [
    "dataknobs-data[postgres]",
    "dataknobs-common[postgres]",
]
s3 = [
    # The S3 knowledge backend uses aioboto3 for non-blocking S3 I/O
    # (clients are async per-operation context managers). boto3 is kept
    # for consumers / tooling that still build sync clients directly.
    "boto3>=1.26.0",
    "aioboto3>=12.0.0",
]
# `dataknobs-bots[server]` brings in FastAPI for the reference
# `create_registry_router` HTTP server in `registry.server`.  The
# module lazy-imports FastAPI so the package still imports cleanly
# when the extra is not installed; callers that actually invoke
# `create_registry_router` must install this extra.
server = [
    # fastapi>=0.133.0 is the lowest fastapi whose starlette
    # constraint (starlette>=0.40.0, no upper cap) permits the patched
    # starlette 1.x pinned below; fastapi <0.133.0 capped starlette<1.0.0.
    "fastapi>=0.133.0",
    "starlette>=1.3.1",  # GHSA-82w8-qh3p-5jfq (CVSS 7.5, request.form() ignores max_fields/max_part_size on URL-encoded payloads → DoS) fixed in 1.3.1; also sweeps GHSA-jp82-jpqv-5vv3 (CVSS 3.7, request.url userinfo poisoning on malformed paths, 1.3.0), GHSA-wqp7-x3pw-xc5r (CVSS 7.5, Windows StaticFiles NTLM credential leak via UNC paths, 1.1.0), GHSA-x746-7m8f-x49c (CVSS 5.3, HTTPEndpoint method dispatch without explicit methods= argument, 1.1.0), and the prior PYSEC-2026-161 / GHSA-86qp-5c8j-p5mr / GHSA-7f5h-v6xp-fcq8 / GHSA-2c2j-9gv5-cj73 sweep (1.0.1, 0.49.1)
]
all = [
    "dataknobs-bots[faiss,http,postgres,s3,server]",
]

[tool.uv.sources]
dataknobs-common = { workspace = true }
dataknobs-config = { workspace = true }
dataknobs-llm = { workspace = true }
dataknobs-data = { workspace = true }
dataknobs-utils = { workspace = true }
dataknobs-xization = { workspace = true }
dataknobs-fsm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    # FastAPI + httpx power the reference registry-router tests
    # (test_registry_server.py).  FastAPI is an optional runtime
    # dependency — dataknobs_bots.registry.server lazy-imports it so
    # the package still imports cleanly when FastAPI is absent.
    # fastapi pinned to match the [server] extra's starlette CVE
    # floor (see the comment there); fastapi <0.133.0 capped starlette<1.0.0.
    "fastapi>=0.133.0",
    "starlette>=1.3.1",  # GHSA-82w8-qh3p-5jfq (CVSS 7.5, request.form() ignores max_fields/max_part_size on URL-encoded payloads → DoS) fixed in 1.3.1; also sweeps GHSA-jp82-jpqv-5vv3 (CVSS 3.7, request.url userinfo poisoning on malformed paths, 1.3.0), GHSA-wqp7-x3pw-xc5r (CVSS 7.5, Windows StaticFiles NTLM credential leak via UNC paths, 1.1.0), GHSA-x746-7m8f-x49c (CVSS 5.3, HTTPEndpoint method dispatch without explicit methods= argument, 1.1.0), and the prior PYSEC-2026-161 / GHSA-86qp-5c8j-p5mr / GHSA-7f5h-v6xp-fcq8 / GHSA-2c2j-9gv5-cj73 sweep (1.0.1, 0.49.1)
    "httpx>=0.27.0",
    # aiohttp backs HTTPRegistryBackend's transport and the in-process
    # aiohttp.web test server in test_registry_http_backend.py. Declared
    # explicitly so those tests do not depend on aiohttp arriving
    # transitively through aioboto3 -> aiobotocore; pinned to match the
    # [http] extra's CVE floor (see the comment there).
    "aiohttp>=3.14.3",
    # aioboto3 backs the S3 knowledge backend's async transport. The dev
    # group needs it installed so the LocalStack-gated S3 integration
    # tests exercise the real async client path (mock_aws is incompatible
    # with aiobotocore — see test_s3_localstack_integration.py). The
    # shared LocalStack fixtures come from dataknobs-common's pytest11
    # plugin; bucket setup there is also aioboto3-backed.
    "aioboto3>=12.0.0",
    # blockbuster powers the reproduce-first async-blocking assertions
    # (assert_no_blocking from dataknobs-common) used by the knowledge
    # backend / RAG ingest offload tests. Without it installed here those
    # assertions would skip instead of proving the offloads keep the loop
    # unblocked. Dev/test-only — never imported by shipped runtime code.
    "blockbuster>=1.5.26,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_bots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Mirrors the root pytest.ini. Only one of the two configurations applies
# to any given run — this one when pytest is invoked on this package alone,
# the root when the invocation names anything else — so a value declared in
# one and not the other makes the argument list decide how modules are
# imported. `asyncio_mode` below is mirrored for the same reason.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "s3: marks tests that require S3/LocalStack",
]

[tool.coverage.run]
source = ["src/dataknobs_bots"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "chromadb.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "ASYNC",  # flake8-async - async code must not block the event loop
]

ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D213", # Multi-line docstring summary should start at the second line
    "D400", # First line should end with a period
    "D401", # First line should be in imperative mood
    "D404", # First word of the docstring should not be "This"
    "B905", # zip() without an explicit strict parameter

    # Modernizations deliberately declined — each would change a public API,
    # not just syntax. Full rationale in the root pyproject.toml ignore list.
    "ASYNC109",  # `timeout` parameter on an async def; for a contract method
                 # the parameter *is* the interface. The blocking-I/O members
                 # of this family (ASYNC210 / 230 / 240 / 251) stay enforced.
    "UP040",     # `type` statement: changes introspection of published aliases.
    "UP042",     # StrEnum: changes str()/f-string rendering of published enums.
    "UP046",     # PEP 695 class type params: infers variance on Protocols that
                 # declare it, and scopes an __all__-exported TypeVar.
    "UP047",     # PEP 695 function type params: fragments a TypeVar shared by a
                 # class and a function in one module.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "F401"]
"tests/*" = ["D100", "D101", "D102", "D103", "S101"]
# One-time ingest-setup path resolution (cwd + existence checks); setup-time,
# not a per-record hot path.
"src/dataknobs_bots/knowledge/service.py" = ["ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = [
    "dataknobs_bots",
    "dataknobs_common",
    "dataknobs_config",
    "dataknobs_llm",
    "dataknobs_data",
    "dataknobs_utils",
    "dataknobs_xization",
    "dataknobs_fsm"
]

[tool.ruff.lint.pydocstyle]
convention = "google"
