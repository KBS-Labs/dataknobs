[project]
name = "dataknobs-xization"
version = "2.2.1"
description = "Text normalization and tokenization tools"
readme = "README.md"
authors = [
    { name = "Spence Koehler", email = "KoehlerSB747@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dataknobs-common>=3.2.0",
    "dataknobs-structures>=1.0.17",
    "dataknobs-utils>=2.0.2",
    "beautifulsoup4>=4.12.0",
    "nltk>=3.10.2",  # 3.10.1 shipped an import-security hook (nltk/inisec.py) that blocked any module resolving under the current working directory, without excluding an in-tree virtualenv: with the venv inside the project (uv's default layout) it broke `import regex` for every nltk-initiated import, and with cwd=/ it blocked the stdlib. The documented PYTHONSAFEPATH workaround does not help, because the check is path-containment, not sys.path membership. 3.10.2 removes the module. GHSA-p4gq-832x-fm9v / PYSEC-2026-2078 / CVE-2026-54293 (CVSS 7.5, path traversal in nltk.data.find()/load() via percent-encoded (..%2f) sequences that bypass the ../ regex check once url2pathname() decodes them) fixed in 3.10.0; also keeps GHSA-rf74-v2fm-23pw, CVE-2026-33230, CVE-2026-33231 (fixed in 3.9.4). PYSEC-2026-597/CVE-2026-12243 (CVSS 7.5, same path-traversal class) has no upstream fix as of 2026-07-14 — accepted: this codebase loads only fixed corpus names (wordnet/omw-1.4/wordnet_ic) and never passes caller-controlled strings into nltk.data.find()
    "more-itertools>=8.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[tool.uv.sources]
dataknobs-common = { workspace = true }
dataknobs-structures = { workspace = true }
dataknobs-utils = { workspace = true }

[dependency-groups]
dev = [
    # blockbuster powers the reproduce-first async-blocking assertions
    # (assert_no_blocking / requires_blockbuster from dataknobs-common)
    # used by the LocalDocumentSource async-offload tests. Without it
    # installed here those assertions would skip instead of proving the
    # ingest enumeration keeps the loop unblocked. Dev/test-only — never
    # imported by shipped runtime code.
    "blockbuster>=1.5.26,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataknobs_xization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Mirrors the root pytest.ini. Only one of the two configurations applies
# to any given run — this one when pytest is invoked on this package alone,
# the root when the invocation names anything else — so a value declared in
# one and not the other makes the argument list decide how modules are
# imported. `asyncio_mode` below is mirrored for the same reason.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/dataknobs_xization"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "bs4.*",
    "pandas.*",
    "nltk.*",
    "lark.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
