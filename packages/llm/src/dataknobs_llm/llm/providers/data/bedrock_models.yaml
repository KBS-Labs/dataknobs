# Amazon Bedrock model profiles — the maintained-fallback source for the Bedrock binding.
#
# Bedrock serves TWO model populations behind one provider, and this resource
# carries a DIFFERENT slice of each:
#
# 1. NON-Claude models (amazon.nova / amazon.titan / meta.llama / mistral /
#    cohere / ai21) — the FULL profile: capabilities, output/context ceilings,
#    pricing, availability. dataknobs ships no other source for these families.
#
# 2. Claude-on-Bedrock (anthropic.claude-...) — ONLY the Bedrock-owned facets:
#    `pricing` and `available`. A Claude model's capabilities, output ceiling,
#    context window, and `temperature` rejection are properties of the model
#    *family*, not the endpoint, so they are sourced from the shared Claude
#    profile sources (`_claude_shared.claude_resource_profile` /
#    `claude_heuristic_profile`) that BOTH the Anthropic and Bedrock resolvers
#    compose — never re-copied here (that would be the exact drift the
#    substrate exists to remove). AWS bills Bedrock separately and the account
#    catalog is an AWS question, so only those two facets are Bedrock-owned.
#
# NO default live source: `bedrock:ListFoundationModels` is a control-plane
# permission distinct from `bedrock:InvokeModel`, so a live default would break
# least-privilege inference-only roles with AccessDenied. This resource is the
# default availability/capability source; opt into a live-availability
# `ListFoundationModels` source via `options["model_availability_live"]=true`.
#
# Precedence at runtime: LLMConfig.model_profile_overrides (always wins) →
# [optional live availability] → this resource → the shared Claude ceiling +
# capability sources (Claude ids only) → a last-resort capability heuristic
# (unlisted vendor families). A consumer pins any facet for any model via
# model_profile_overrides without a dataknobs release.
#
# Source: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
#         + https://aws.amazon.com/bedrock/pricing/
# Last verified: 2026-07-25
# Shape (each model → any of):
#   context_window     int  -> ModelConstraints.max_input_tokens (input budget)
#   max_output_tokens  int  -> ModelConstraints.max_tokens_ceiling (output clamp)
#   capabilities       [str] value strings: text_generation/chat/streaming/code/
#                            vision/function_calling/json_mode/embeddings
#   pricing            {*_per_mtok} USD per 1M tokens (on-demand, us-east-1)
#   available          bool  -> validate_model result (True = a recognized model)
# Keyed by family alias; the substring matcher resolves a dated / region-prefixed
# id (e.g. us.amazon.nova-pro-v1:0) to its family key.
models:
  # === Claude-on-Bedrock — Bedrock-owned facets only (pricing + available) =====
  # Capabilities / ceilings / temperature rejection come from _claude_shared.
  anthropic.claude-3-5-sonnet:
    pricing: {input_per_mtok: 3.0, output_per_mtok: 15.0}
    available: true
  anthropic.claude-3-5-haiku:
    pricing: {input_per_mtok: 0.8, output_per_mtok: 4.0}
    available: true
  anthropic.claude-3-sonnet:
    pricing: {input_per_mtok: 3.0, output_per_mtok: 15.0}
    available: true
  anthropic.claude-3-haiku:
    pricing: {input_per_mtok: 0.25, output_per_mtok: 1.25}
    available: true
  anthropic.claude-3-opus:
    pricing: {input_per_mtok: 15.0, output_per_mtok: 75.0}
    available: true
  anthropic.claude-opus-4:
    pricing: {input_per_mtok: 15.0, output_per_mtok: 75.0}
    available: true
  anthropic.claude-sonnet-4:
    pricing: {input_per_mtok: 3.0, output_per_mtok: 15.0}
    available: true

  # === Amazon Nova (nova-lite/pro/premier are multimodal; micro is text) ======
  amazon.nova-micro:
    context_window: 128000
    max_output_tokens: 5120
    capabilities: [text_generation, chat, streaming, code, function_calling]
    pricing: {input_per_mtok: 0.035, output_per_mtok: 0.14}
    available: true
  amazon.nova-lite:
