    max_output_tokens: 5120
    capabilities: [text_generation, chat, streaming, code, vision, function_calling]
    pricing: {input_per_mtok: 0.8, output_per_mtok: 3.2}
    available: true
  amazon.nova-premier:
    context_window: 1000000
    max_output_tokens: 5120
